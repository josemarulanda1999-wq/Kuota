name: Voz para tutoriales
on:
  push:
    branches: [tutoriales]
    paths: ['tts/segmentos.json']
permissions: {}
jobs:
  voz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generar voz (es-CO, mujer)
        run: |
          pip install edge-tts
          python - <<'PY'
          import json, asyncio, os, edge_tts
          seg = json.load(open('tts/segmentos.json', encoding='utf-8'))
          os.makedirs('tts/out', exist_ok=True)
          async def main():
              for i, s in enumerate(seg['textos']):
                  c = edge_tts.Communicate(s, seg.get('voz', 'es-CO-SalomeNeural'), rate=seg.get('rate', '+0%'))
                  await c.save(f'tts/out/{i:02d}.mp3')
          asyncio.run(main())
          PY
      - name: Guardar audios
        run: |
          git config user.name "kuota-bot"; git config user.email "kuota-bot@users.noreply.github.com"
          git add tts/out && git commit -m "Audios generados" && git push
