name: Compilar APK y versión web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app web
        run: node build.mjs

      - name: Guardar versión web (para GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Revisar Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Crear proyecto Android
        run: |
          npx cap add android
          node ci/android-setup.mjs
          npx cap sync android

      - name: Compilar APK (producción, firmado con la llave privada de Kuota)
        env:
          KUOTA_KEYSTORE: ${{ secrets.KUOTA_KEYSTORE }}
          KUOTA_KS_PASS: ${{ secrets.KUOTA_KS_PASS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KUOTA_KEYSTORE" ] && [ -n "$KUOTA_KS_PASS" ]; then
            echo "$KUOTA_KEYSTORE" | base64 -d > "$RUNNER_TEMP/kuota-release.jks"
            export KUOTA_KS="$RUNNER_TEMP/kuota-release.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Kuota.apk
            rm -f "$RUNNER_TEMP/kuota-release.jks"
          else
            echo "::warning::Falta la llave privada (secretos KUOTA_KEYSTORE y KUOTA_KS_PASS). Se compila una versión temporal."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Kuota.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Kuota-apk
          path: Kuota.apk

      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kuota ${{ github.run_number }}
          body: Descarga **Kuota.apk** e instálalo en el celular.
          files: Kuota.apk

  web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
