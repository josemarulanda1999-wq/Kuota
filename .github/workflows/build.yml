name: Compilar APK y versión web

on:
  push:
    branches: [main]
  workflow_dispatch:

# por defecto el flujo no tiene permisos; cada trabajo pide solo lo que necesita
permissions: {}

jobs:
  # publica firestore.rules en Firebase en cada cambio (así no hay que copiarlas a mano)
  reglas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Publicar reglas de Firestore
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT: las reglas NO se publicaron. Cópialas a mano en Firebase o agrega el secreto."
            exit 0
          fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROYECTO=$(sed -n 's/.*projectId: *"\([^"]*\)".*/\1/p' src/firebase-config.js)
          npx --yes firebase-tools@13 deploy --only firestore:rules --project "$PROYECTO" --non-interactive || { rm -f "$RUNNER_TEMP/sa.json"; exit 1; }
          rm -f "$RUNNER_TEMP/sa.json"
          echo "Reglas publicadas en $PROYECTO"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publicar el APK en Releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app web
        run: node build.mjs

      - name: Guardar versión web (para GitHub Pages)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: www

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Revisar Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Crear proyecto Android
        run: |
          npx cap add android
          node ci/android-setup.mjs
          npx cap sync android

      - name: Compilar APK (producción, firmado con la llave privada de Kuota)
        env:
          KUOTA_KEYSTORE: ${{ secrets.KUOTA_KEYSTORE }}
          KUOTA_KS_PASS: ${{ secrets.KUOTA_KS_PASS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KUOTA_KEYSTORE" ] && [ -n "$KUOTA_KS_PASS" ]; then
            # se limpian espacios y saltos de línea que se cuelan al pegar los secretos desde Windows
            printf '%s' "$KUOTA_KEYSTORE" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/kuota-release.jks" || { echo "::error::El secreto KUOTA_KEYSTORE no es un texto base64 válido. Vuelve a pegar el contenido completo de KUOTA_KEYSTORE.txt"; exit 1; }
            export KUOTA_KS_PASS="$(printf '%s' "$KUOTA_KS_PASS" | tr -d '\r\n')"
            export KUOTA_KS="$RUNNER_TEMP/kuota-release.jks"
            keytool -list -keystore "$KUOTA_KS" -storepass "$KUOTA_KS_PASS" -alias kuota > /dev/null || { echo "::error::La llave o la contraseña no coinciden. Revisa que KUOTA_KS_PASS sea exactamente el contenido de KUOTA_KS_PASS.txt"; exit 1; }
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Kuota.apk
            rm -f "$RUNNER_TEMP/kuota-release.jks"
          else
            echo "::warning::Falta la llave privada (secretos KUOTA_KEYSTORE y KUOTA_KS_PASS). Se compila una versión temporal."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Kuota.apk
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kuota-apk
          path: Kuota.apk

      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kuota ${{ github.run_number }}
          body: Descarga **Kuota.apk** e instálalo en el celular.
          files: Kuota.apk

  web:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
